<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <main>
        <section class="contenedor">

            <h2>Formulario de Registro</h2> <a class="loginBottons" href="../INICIO/Inicio.html">Volver</a>

            <form id="miFormulario" action="" method="post">

                <div id= "imgel">
                <img width="90" height="90" src="Logo.png">
                </div>
                
                <!-- Campo para ingresar el nombre (Register) -->
                <label for="Nm">Nombre</label required>
                <input type="text" id="Nm" name="Nombre" placeholder="Ej: Juan">

                <!-- Campo para ingresar el apellido (Register) -->
                <label for="Ap">Apellido</label required>
                <input type="text" id="Ap" name="Apellido" placeholder="Ej: Zorrila">

                <!--Campo para ingresar el username (Register)-->
                <label for="Usuario">Nombre de Usuario</label required>
                <input type="text" id="Usuario" name="Usuario" placeholder="Ingrese su usuario" required>
                
                <!--Campo para ingresar el correo electrónico (Register) -->
                <label for="Correo">Correo electrónico</label required>
                <input type="email" id="Correo" name="Correo" placeholder="ejemplo@correo.com" required>

                <!--Campo para ingresar la contraseña (Register)-->
                <label for="Contrasena">Contraseña</label required>
                <input type="password" id="Contrasena" name="Contrasena" placeholder="Ingrese su contraseña" required>

                <!--Campo para ingresar el número de contacto (Register)-->
                <label for="Contacto">Contacto</label required>
                <input type="tel" id="Contacto" name="Contacto" placeholder="099123456">

                <!--Campo para ingresar la ocupación (Register)-->
                <label for="Ocupación">Ocupación</label required>
                <select id="Ocupación">
                    <option value="opcion2"> Docente </option>
                    <option value="opcion3"> Estudiante</option>
                </select>


                <button type="submit" class="btn">Agregar</button>
                <button type="reset" class="btn">Limpiar</button>

                

            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
